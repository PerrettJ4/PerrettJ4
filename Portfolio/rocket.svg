<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <clipPath id="body-clip">
      <path d="M200 40 C 270 110, 300 230, 295 360 L 280 560 L 120 560 L 105 360 C 100 230, 130 110, 200 40 Z" />
    </clipPath>
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#b9ecff" />
      <stop offset="0.55" stop-color="#4fb3f0" />
      <stop offset="1" stop-color="#2463b8" />
    </radialGradient>
    <linearGradient id="flame-outer" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff5a36" />
      <stop offset="1" stop-color="#ff9a2e" />
    </linearGradient>
    <linearGradient id="flame-inner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23f" />
      <stop offset="1" stop-color="#ffb52e" />
    </linearGradient>
  </defs>

  <g stroke="#1d2340" stroke-width="7" stroke-linejoin="round" stroke-linecap="round">
    <!-- smoke puffs trailing behind -->
    <g fill="#eef1f7">
      <circle cx="150" cy="690" r="46" />
      <circle cx="98" cy="728" r="34" />
      <circle cx="200" cy="728" r="30" />
      <circle cx="52" cy="700" r="18" />
      <circle cx="150" cy="752" r="24" />
    </g>
    <g fill="none" stroke="#c9cfdd" stroke-width="6">
      <path d="M128 668 a26 26 0 0 1 30 -8" />
      <path d="M186 712 a18 18 0 0 1 22 -4" />
    </g>

    <!-- sparkles -->
    <g fill="#ffd23f" stroke-width="5">
      <path d="M660 80 l12 30 l30 12 l-30 12 l-12 30 l-12 -30 l-30 -12 l30 -12 Z" />
      <path d="M700 330 l7 17 l17 7 l-17 7 l-7 17 l-7 -17 l-17 -7 l17 -7 Z" />
      <path d="M430 120 l7 17 l17 7 l-17 7 l-7 17 l-7 -17 l-17 -7 l17 -7 Z" />
    </g>

    <!-- rocket, drawn upright then tilted -->
    <g transform="translate(410 390) rotate(40) scale(0.82) translate(-200 -400)">
      <!-- flame -->
      <path fill="url(#flame-outer)" d="M140 590 C 120 690, 160 760, 200 830 C 240 760, 280 690, 260 590 Z" />
      <path fill="url(#flame-inner)" stroke-width="0" d="M163 595 C 150 670, 175 720, 200 770 C 225 720, 250 670, 237 595 Z" />
      <path fill="#fff6d6" stroke-width="0" d="M184 598 C 178 640, 190 670, 200 695 C 210 670, 222 640, 216 598 Z" />

      <!-- side fins -->
      <path fill="#e8484b" d="M112 380 C 50 410, 28 490, 40 610 C 70 580, 100 565, 125 555 Z" />
      <path fill="#e8484b" d="M288 380 C 350 410, 372 490, 360 610 C 330 580, 300 565, 275 555 Z" />
      <path fill="#b8323a" stroke="none" d="M112 395 C 70 425, 52 490, 50 585 C 62 575, 72 568, 82 562 C 80 500, 92 450, 116 420 Z" />
      <path fill="#b8323a" stroke="none" d="M288 395 C 330 425, 348 490, 350 585 C 338 575, 328 568, 318 562 C 320 500, 308 450, 284 420 Z" />

      <!-- nozzle -->
      <path fill="#8b93a8" d="M135 555 L 265 555 L 250 605 L 150 605 Z" />
      <path fill="#6b7389" stroke="none" d="M225 560 L 260 560 L 247 600 L 220 600 Z" />

      <!-- body fill + details, clipped to hull -->
      <g clip-path="url(#body-clip)" stroke="none">
        <rect x="80" y="20" width="240" height="560" fill="#f6f3ec" />
        <!-- right-side shading -->
        <path fill="#dcd6c8" d="M235 20 C 290 120, 300 260, 290 380 L 280 580 L 320 580 L 320 20 Z" />
        <!-- left highlight -->
        <path fill="#ffffff" d="M140 170 C 128 230, 126 320, 132 420 L 146 420 C 142 320, 144 240, 154 175 Z" />
        <!-- nose cone -->
        <path fill="#e8484b" d="M80 20 H 320 V 175 Q 200 215, 80 175 Z" />
        <path fill="#b8323a" d="M235 20 C 262 70, 280 120, 290 180 Q 262 192, 240 197 C 238 140, 232 80, 225 20 Z" />
        <path fill="#ff8a7a" d="M168 95 C 158 115, 150 140, 146 165 L 158 170 C 160 145, 166 120, 176 100 Z" />
        <!-- bottom band -->
        <path fill="#e8484b" d="M80 505 Q 200 540, 320 505 V 580 H 80 Z" />
        <path fill="#b8323a" d="M262 516 Q 290 510, 320 500 V 580 H 262 Z" />
      </g>
      <g clip-path="url(#body-clip)" fill="none">
        <path d="M80 175 Q 200 215, 320 175" />
        <path d="M80 505 Q 200 540, 320 505" />
      </g>

      <!-- rivets -->
      <g fill="#b9b3a4" stroke="none">
        <circle cx="140" cy="470" r="6" />
        <circle cx="200" cy="480" r="6" />
        <circle cx="260" cy="470" r="6" />
      </g>

      <!-- hull outline -->
      <path fill="none" d="M200 40 C 270 110, 300 230, 295 360 L 280 560 L 120 560 L 105 360 C 100 230, 130 110, 200 40 Z" />

      <!-- centre fin (edge-on) -->
      <path fill="#e8484b" d="M200 455 C 216 470, 220 560, 216 615 L 184 615 C 180 560, 184 470, 200 455 Z" />
      <path fill="#b8323a" stroke="none" d="M204 468 C 212 490, 214 560, 212 610 L 202 610 C 204 560, 204 500, 204 468 Z" />

      <!-- porthole -->
      <circle cx="200" cy="320" r="66" fill="#aab2c5" />
      <circle cx="200" cy="320" r="48" fill="url(#glass)" />
      <path fill="none" stroke="#ffffff" stroke-width="9" d="M172 300 A 34 34 0 0 1 198 284" />
      <circle cx="226" cy="344" r="6" fill="#ffffff" stroke="none" opacity="0.7" />
      <g fill="#7d869c" stroke="none">
        <circle cx="200" cy="264" r="5" />
        <circle cx="256" cy="320" r="5" />
        <circle cx="200" cy="376" r="5" />
        <circle cx="144" cy="320" r="5" />
      </g>
    </g>
  </g>
</svg>
